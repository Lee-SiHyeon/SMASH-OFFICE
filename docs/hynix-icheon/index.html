<style>
:root{--bg:#0d1118;--panel:rgba(16,21,30,.78);--line:rgba(255,255,255,.12);--fg:#f2f5f9;--muted:#9aa6b6;--accent:#ff6a2b;--accent2:#21d07a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#left{position:fixed;left:16px;top:16px;width:236px;display:flex;flex-direction:column;gap:10px;z-index:5}
#brand{padding:12px 14px}
#series{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.02em}
#title{font-size:21px;font-weight:900;margin-top:2px;letter-spacing:-.02em}
#brow{display:flex;align-items:center;gap:10px;margin-top:4px}
#logo{flex:none;height:42px;min-width:42px;max-width:104px;border-radius:10px;background:#fff;display:grid;place-items:center;padding:5px;box-sizing:border-box;box-shadow:0 1px 0 rgba(0,0,0,.25)}#logo[hidden]{display:none}
#logo img{max-height:32px;max-width:94px;display:block}#logo b{font-size:20px;font-weight:900;color:#fff}
#brow #title{margin-top:0;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere}
#dock{padding:6px;display:flex;flex-direction:column;gap:4px}
.tool{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--fg);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.tool:hover{background:rgba(255,255,255,.06)}
.tool.on{background:rgba(255,106,43,.18);border-color:var(--accent)}
.tool .ic{width:22px;height:22px;flex:none}
.tool .nm{flex:1}.tool .sh{display:none}
.tool kbd{font:500 11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
#sliderWrap{padding:10px 12px}
#sliderWrap .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
#sliderVal{color:var(--fg);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
#tip{font-size:12px;color:#e6ebf1;padding:8px 12px;line-height:1.45;background:var(--panel);border:1px solid var(--line);border-radius:12px}
#right{position:fixed;right:16px;top:16px;width:218px;padding:12px 14px;z-index:5}
#h-score{font-size:30px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rankrow{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
#h-rank{padding:3px 10px;border-radius:999px;font-weight:800;font-size:14px;color:#fff;transition:background .3s}
#h-mult{font-weight:700;color:var(--muted);font-size:13px}
.barw{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-bottom:10px}
#h-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ffd166);transition:width .15s}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--muted)}
.stat b{color:var(--fg);font-variant-numeric:tabular-nums}
#menuBtn{display:none}
#bottom{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;z-index:5}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px)}
.btn:hover{border-color:rgba(255,255,255,.3)}
.btn.on{border-color:var(--accent);color:#ffd2bf}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#hubBtn{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#ffb38f;text-decoration:none}
#hubBtn:hover{text-decoration:underline}
#labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.blabel{position:absolute;left:0;top:0;padding:3px 8px;border-radius:7px;background:rgba(14,18,26,.72);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;will-change:transform}
.blabel::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-4px;border:4px solid transparent;border-top-color:rgba(14,18,26,.72);border-bottom:0}
#hover{position:fixed;left:0;top:0;z-index:9;pointer-events:none;background:rgba(10,14,22,.9);border:1px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px}
#hover[hidden]{display:none}#hover span{color:var(--muted);font-size:11px}
#credit{position:fixed;left:16px;bottom:10px;font-size:11px;color:rgba(255,255,255,.55);z-index:4;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-10px);padding:10px 18px;border-radius:999px;background:rgba(10,14,22,.85);border:1px solid var(--line);font-weight:800;font-size:16px;opacity:0;transition:.25s;z-index:8;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.float{position:absolute;left:0;top:0;font-weight:900;font-size:17px;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 10px rgba(0,0,0,.4);will-change:transform}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(30,20,14,.55),rgba(8,10,16,.92));transition:opacity .5s}
#start.gone{opacity:0;pointer-events:none}
.startbox{text-align:center;padding:0 16px;max-width:560px}
#startSeries{color:var(--accent);font-weight:800;font-size:14px}
#startTitle{font-size:clamp(38px,9vw,72px);font-weight:900;letter-spacing:-.04em;margin:8px 0 6px;line-height:1.05}
#startTag{color:#d5dbe3;font-size:17px;margin-bottom:26px}
.modes{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
.mbtn{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;cursor:pointer}
.mbtn b{font-size:18px;font-weight:900}.mbtn span{font-size:12px;color:var(--muted)}
.mbtn.primary{background:var(--accent);border-color:var(--accent)}.mbtn.primary span{color:#ffe2d4}
.mbtn.ghost{background:transparent}
#timer{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:7;font:900 34px ui-monospace,monospace;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);background:rgba(10,14,22,.55);padding:4px 16px;border-radius:12px;pointer-events:none}
#timer[hidden]{display:none}#timer.hurry{color:#ff4d4d;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.12)}}
.tool.ban{opacity:.35}
.btabs{display:flex;gap:6px;margin:0 0 10px}.bt{flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.bt.on{background:var(--fg);color:#111}
.how{margin-top:22px;color:var(--muted);font-size:13px;line-height:1.7}
#cardModal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.7);padding:16px}
#cardModal[hidden],#rankModal[hidden]{display:none}
#rankModal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.6);padding:16px}
#rankModal .box{width:100%;max-width:420px;max-height:80vh;overflow:auto;padding:16px}
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.rhead b{flex:1;font-size:18px}.rhead a{color:#ffb38f;font-size:12px;font-weight:700;text-decoration:none}
#rankList ol{list-style:none;margin:0;padding:0}
#rankList li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
#rankList li.me{background:rgba(255,106,43,.15);border-radius:8px}
#rankList .no{width:22px;color:var(--muted);font-weight:800;text-align:right}
#rankList b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rankList .rk{font-size:11px;color:var(--muted)}
#rankList .sc{font-weight:800;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:13px}
#nick{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px}
#submitRow[hidden]{display:none}#submitMsg{flex:none!important;font-size:12px;color:#ffd2bf!important}
#cardModal .box{max-width:760px;width:100%;padding:14px}
#cardImg{width:100%;border-radius:10px;display:block}
#cardModal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;align-items:center}
#cardModal .row span{flex:1;font-size:12px;color:var(--muted)}
@media (max-width:760px), (pointer:coarse) and (max-width:1100px){
  #left{left:0;right:0;top:auto;bottom:0;width:auto;gap:6px;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
  #brand{position:fixed;left:10px;top:10px;padding:8px 10px}
  #title{font-size:16px}#series{font-size:10px}
  #brand{max-width:calc(100vw - 186px)}#logo{height:34px;min-width:34px;max-width:80px;padding:4px;border-radius:8px}#logo img{max-height:26px;max-width:72px}#logo b{font-size:16px}#brow{gap:8px}
  #dock{flex-direction:row;overflow-x:auto;gap:4px}
  .tool{flex-direction:column;gap:2px;padding:6px 4px;min-width:62px;font-size:11px;text-align:center}
  .tool kbd,.tool .nm{display:none}.tool .sh{display:block;white-space:nowrap}
  .tool{min-width:0;flex:1}
  #tip{display:none}
  #right{top:10px;right:10px;width:150px;padding:8px 10px}
  #h-score{font-size:20px}.stat{font-size:11px}
  #bottom{top:auto;bottom:auto;right:10px;top:206px;flex-direction:column;align-items:flex-end}
  #menuBtn{display:block}
  #bottom:not(.open) .btn:not(#menuBtn):not(#cardBtn){display:none}
  #bottom .btn{padding:7px 9px;font-size:12px}
  #hubBtn{font-size:11px;margin-top:3px}
  .blabel{font-size:10px;padding:2px 6px}
  #credit{display:none}
  #toast{font-size:13px;top:auto;bottom:150px}
  #timer{top:auto;bottom:118px;font-size:28px}
}
</style>
</head>
